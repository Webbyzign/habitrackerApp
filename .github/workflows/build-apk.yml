name: Build HTML/JS to Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install Cordova globally
      run: npm install -g cordova

    - name: Create Cordova Project
      run: |
        cordova create my-app com.example.webapp MyApp
        cd my-app
        # Copy your HTML, CSS, JS files into Cordova's www folder
        rm -rf www/*
        cp -r ../* www/ 2>/dev/null || true
        # Clean up unwanted files copied from root
        rm -rf www/.git www/.github www/my-app
        cordova platform add android

    - name: Build Android Debug APK
      run: |
        cd my-app
        cordova build android --debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: my-app/platforms/android/app/build/outputs/apk/debug/app-debug.apk

